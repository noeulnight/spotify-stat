---
name: Nightly build CI

on:
  push:
    paths:
      - .github/workflows/nightly.yml
      - Dockerfile.client.production
      - Dockerfile.server.production
      - apps/dev/**
      - apps/client/**
      - apps/server/**
      - pnpm-lock.yaml
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client nightly
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.client.production
          build-args: |
            PUBLIC_API_BASE_URL=/api
            SITE_URL=https://spotify.lth.so
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spotify-stat-client:nightly-${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/spotify-stat-client:${{ github.sha }}-${{ matrix.suffix }}

      - name: Build and push server nightly
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server.production
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spotify-stat-server:nightly-${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/spotify-stat-server:${{ github.sha }}-${{ matrix.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          for component in client server; do
            docker buildx imagetools create \
              --tag "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:nightly" \
              "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:nightly-amd64" \
              "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:nightly-arm64"
            docker buildx imagetools create \
              --tag "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:${GITHUB_SHA}" \
              "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:${GITHUB_SHA}-amd64" \
              "ghcr.io/${GHCR_OWNER}/spotify-stat-${component}:${GITHUB_SHA}-arm64"
          done
