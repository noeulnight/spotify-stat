packages:
  - apps/*

allowBuilds:
  core-js-pure: true
  esbuild: true

catalog:
  '@eslint/json': 1.2.0
  '@rsbuild/core': 2.0.15
  globals: 17.6.0
  typescript: 6.0.3
  typescript-eslint: 8.59.3
  oxfmt: 0.55.0
  oxlint: 1.70.0

minimumReleaseAgeExclude:
  - uuid@14.0.1
  - '@astrojs/internal-helpers@0.13.0'
  - '@astrojs/markdown-satteri@0.4.4'
  - '@astrojs/node@11.1.8'
  - '@astrojs/prism@4.1.0'
  - '@astrojs/react@7.1.0'
  - '@astrojs/telemetry@3.4.0'
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - astro@7.4.0

onlyBuiltDependencies:
  - core-js
  - unrs-resolver
